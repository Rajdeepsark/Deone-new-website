# Most of this page now carries the Executive design's own copy and pictures. What is
# still borrowed from Prestige or standing in is marked PLACEHOLDER, STAND-IN or
# PROVISIONAL below: the hero sentence, the Executive Card tab's heading and the bracelet
# picture. The Full benefits list is also still the Prestige one.
name: Executive

# The page's colours, section by section, as the design file gives them. `background`
# takes any CSS background; `ink` is the colour of the section's words and lines. Quote
# any value with a # in it, or YAML reads the rest of the line as a comment.
# Sections left out keep the Prestige look, whose values are in src/styles/global.css.
theme:
  # "Time is your greatest asset"
  pictures:
    background: "linear-gradient(180deg, #939595 0%, #454947 100%)"
    ink: "#FCFAF7"
  # "A higher standard, wherever life leads"
  benefits:
    background: "linear-gradient(0deg, #454947, #454947), linear-gradient(180deg, #939595 0%, #E4E5E5 100%), linear-gradient(180deg, #9FC4C8 0%, #E7F0F1 100%)"
    ink: "#FCFAF7"
  # "Products"
  security:
    background: "linear-gradient(180deg, #454947 0%, #939595 100%), linear-gradient(180deg, #454947 -141.07%, #FCFAF7 100%)"
    ink: "#FCFAF7"
    # The tab in view is graphite, not the accent.
    tab: "#454947"
    # The feature boxes. The line around the one in focus is the accent at 40%.
    box: "#FCFAF7"
    # The feature icons: graphite fading to grey, measured from the design.
    icon: "linear-gradient(174.31deg, #454947 0%, #B4B6B5 100%)"
  # The slider marker and the line around the box in focus: the DeOne green.
  accent: "#0F6B76"
  # "What's included"
  included:
    background: "linear-gradient(180deg, #939595 0%, #454947 81.08%)"
    ink: "#FCFAF7"
  # "Full benefits"
  details:
    background: "#454947"
    ink: "#FCFAF7"
  # Still to come from the design: night.

hero:
  eyebrow: Suite
  # PLACEHOLDER TEXT: the Prestige sentence, until this suite's own arrives. It fades in
  # over the picture as the page scrolls through the hero.
  body: |-
    For lives shaped by movement, ambition
    and possibility.
  image: /suites/executive-hero.jpg
  imageAlt: Family talking on a sofa on a terrace at dusk
  # The family sits on the right of the picture, so that is where phones look.
  imagePosition: 80% center

pictures:
  # The line breaks are the design's. Phones let the subtext wrap by itself.
  headline: |-
    Time is
    your
    greatest
    asset
  subtext: |-
    More time for what matters, with
    protection that extends to those
    closest to you.

  # Four pictures floating around the headline, in this order:
  # small top-left (blurred), top-right, large bottom-left, small right (blurred)
  gallery:
    - image: /suites/executive-yoga.jpg
    - image: /suites/executive-desert-camp.jpg
      alt: Lounge seating under a canopy at a desert camp, dunes rising behind
    - image: /suites/executive-coast-road.jpg
      alt: Classic coupé on a coastal road above the sea
    - image: /suites/executive-yacht.jpg

  slides:
    - title: Time, returned to you
      description: A dedicated concierge takes care of the details, leaving more time for what matters most.
      image: /suites/executive-safari.jpg
      imageAlt: Couple standing in savannah grass at golden hour as a waiter in white gloves brings champagne on a tray

    - title: What you have built
      description: A higher level of protection for your wealth, with care extending to those closest to you.
      image: /suites/executive-driveway.jpg
      imageAlt: Boy with a school backpack running ahead of his parents across the forecourt of a modern house at sunset

    - title: A legacy in motion
      description: The success you create today can shape the future you leave behind.
      image: /suites/executive-infinity-pool.jpg
      imageAlt: Figure in a white robe beside a curved infinity pool above a wooded bay, a small boat on the water below

benefits:
  eyebrow: Private DeoBanking
  headline: |-
    A higher standard,
    wherever life leads

  # "Learn more" shows only under an item with an `href`, the page it goes to. No item
  # has one yet, so the link is hidden. Phones never show it, as in the phone design.
  # Line breaks in a description are kept on phones and wide screens, to match the designs.
  items:
    - title: Banking
      description: |-
        The fullest expression of Deone banking,
        with reach to match your ambitions.
      image: /suites/executive-banking.jpg
      imageAlt: Man with a glass of champagne looking out over a city skyline at night

    - title: Wellness
      description: |-
        Tools and experiences to restore your
        energy and sustain your wellbeing.
      image: /suites/executive-wellness.jpg
      imageAlt: Woman in a robe and eye mask reclining on a lounger before a window onto snowy mountains

    - title: Rewards
      description: |-
        A richer return, contributing to the wealth
        and wellbeing you continue to shape.
      image: /suites/executive-rewards.jpg
      imageAlt: Woman in a white gown and a diamond necklace in a wood-panelled jeweller's

quote:
  # The line breaks are the design's; wide screens keep them, phones wrap freely.
  text: |-
    Success is not only what you
    achieve. It is the freedom to enjoy it
    and the ability to share what it
    makes possible.
  # The export already has the design's darkening in it.
  image: /suites/executive-quote.jpg
  imageAlt: Man smiling over a leather-bound book in a private jet, a curly-haired child and a woman across the table

security:
  eyebrow: Products
  # The heading for a tab without one of its own. PLACEHOLDER TEXT for the Executive Card
  # tab: the design frames seen so far show The Vault's and the Payment Bracelet's
  # headings, not the card's, so this is still the Prestige wording.
  headline: For what you’re building
  subtext: A more considered way to spend, with lasting protection for what you hold.

  # One tab per product. Each has a picture and a list of features.
  # A tab can have its own `headline` and `subtext`, shown above the tabs while it is
  # chosen.
  # On wide screens the section scrolls through the features of the tab in view, one by
  # one. Tabs change only when chosen.
  # `icon` is any name from src/icons.ts, e.g. shield, guard, tap, plane, percent, card, lock.
  # `imagePlacement` is where the picture sits in the 1512px design frame, in px.
  # A feature can have its own `image:`, shown while that feature is in focus. Without
  # one, the tab's picture is used and simply changes pose from feature to feature.
  # A tab can have a `sequence:` instead, the picture in motion: a folder of frames named
  # 000.webp, 001.webp and so on, which the page scrolls through.
  tabs:
    - label: Executive Card
      # The card turning once around, from the DeOne_CardTurntable_Executive_v001 render.
      # To bring in a newer render: node scripts/import-sequence.mjs <its folder> <this folder>
      sequence: { folder: /suites/executive-card-turntable, frames: 150 }
      # The still the tab goes back to if `sequence` is taken out.
      image: /suites/executive-security-card.png
      imageAlt: Black metal DeOne Executive card, tilted, floating above its shadow
      # Measured from the design: the card's edges there, matched to this picture.
      imagePlacement: { left: 722, top: 635, width: 879 }
      features:
        - icon: globe
          title: Freedom at scale
          description: Worldwide acceptance and elevated limits, for the full scope of your ambitions.
        - icon: diamond
          title: Craft at every touch
          description: Ceramic-metal construction, shaped with precision and finished with a quiet, tactile weight.
        # The design cuts this box off, so its icon is the one Prestige uses for it.
        - icon: percent
          title: Purchase protection
          description: Added reassurance for the things you choose to bring into your life.

    - label: The Vault
      headline: Assets for a lifetime
      subtext: Long-term protection for what you have built.
      image: /suites/executive-security-vault.png
      imageAlt: The Vault, a brushed silver metal card engraved with a shield of concentric lines, floating above its shadow
      # Measured from the design: the card's edges there, matched to this picture.
      imagePlacement: { left: 754, top: 744, width: 804 }
      features:
        - icon: guard
          title: Yours, always
          description: Your assets remain yours. Your Vault Key stays in your hands.
        - icon: card
          title: Built for a lifetime
          description: Reinforced construction, made to protect your assets for the long term.
        - icon: lock
          title: A quieter kind of security
          description: No battery, ports or moving parts. A single tap brings your Vault within reach.

    - label: Payment Bracelet
      headline: Payment Bracelet
      subtext: Payment, wherever life takes you
      # STAND-IN PICTURE: cut from the design screenshot, so it is soft, and it only suits
      # a grey background like this page's. Replace with the real bracelet render
      # (transparent PNG, 2x) and measure its placement again.
      image: /suites/executive-security-bracelet.png
      imageAlt: The DeOne payment bracelet, a black cord with silver clasps and a black plate lettered Deone, floating above its shadow
      # Measured from the design.
      imagePlacement: { left: 844, top: 903, width: 615 }
      features:
        - icon: tap
          title: Always at hand
          description: Power-free by design, ready to make a payment whenever you need it.
        - icon: guard
          title: Card-level protection
          description: The same security standard as your Deone Card, carried on the wrist.
        - icon: diamond
          title: Finished for comfort
          description: Made with materials used in fine timepieces, shaped to sit naturally on the wrist.

included:
  eyebrow: What's included
  headline: Executive, in full
  subtext: Global banking, travel, wellbeing and protection, brought together for the life you lead.

  # Twelve cards, listed column by column: the first four are the left column,
  # the next four the middle, the last four the right.
  # `size` is `square` (328 x 328) or `tall` (328 x 431).
  items:
    # Left column: the Executive pictures and labels, as the design shows them.
    - label: |-
        Onchain Banking
        Account
      size: square
      image: /suites/executive-included-onchain-banking.jpg
      imageAlt: Manhattan skyline at dusk seen through a tall window
    - label: Executive Card
      size: square
      image: /suites/executive-included-executive-card.jpg
      imageAlt: Black DeOne Executive card passed from one hand to another above a payment terminal
    - label: Shopping Rewards
      size: tall
      image: /suites/executive-included-shopping-rewards.jpg
      imageAlt: Man in a dark suit trying on a wristwatch at a jeweller's counter
    # The design has the Vault here, where Prestige has Price and Purchase Protection.
    - label: Deone Vault
      size: tall
      image: /suites/executive-included-vault.jpg
      imageAlt: Man in a grey suit holding the Vault card in one hand and a phone showing its app in the other

    # Middle column: the Executive pictures and labels, as the design shows them.
    - label: Cloud Miner
      size: tall
      image: /suites/executive-included-cloud-miner.jpg
      imageAlt: Man in a cream sweater working on a laptop in warm light
    - label: Travel Accident Insurance
      size: square
      image: /suites/executive-included-travel-insurance.jpg
      imageAlt: Three travellers walking towards jungle ruins as sunlight breaks through the trees
    - label: |-
        +1,700 Airport Lounges
        Worldwide
      size: tall
      image: /suites/executive-included-airport-lounges.jpg
      imageAlt: Man with a coffee in a leather armchair watching a jet through the lounge window
    - label: Deone Bracelet
      size: square
      image: /suites/executive-included-payment-bracelet.jpg
      imageAlt: Wrist wearing the payment bracelet held towards a payment terminal

    # Right column: the Executive pictures and labels, as the design shows them.
    - label: Rewards Hub
      size: square
      image: /suites/executive-included-rewards-hub.jpg
      imageAlt: Glass tower seen from below, its upper floors breaking apart into floating cubes
    - label: Wellness
      size: square
      image: /suites/executive-included-wellness.jpg
      imageAlt: Woman in a robe resting with her eyes closed beside a window onto snowy mountains
    - label: Better Life Rewards™
      size: tall
      image: /suites/executive-included-better-life-rewards.jpg
      imageAlt: Hand holding a phone showing the Rewards Hub in the app
    # Prestige has the Vault here; this page has it in the left column.
    - label: |-
        Price and Purchase
        Protection
      size: tall
      image: /suites/executive-included-purchase-protection.jpg
      imageAlt: Woman in black handing a card across a counter beside a payment terminal

  # Phones show eight of the cards, in two columns of four, top to bottom.
  # `card` is the card's place in the list above (1 to 12). `size` is its height there:
  # `short` (177 x 224) or `tall` (177 x 264) in the 402px design. `label` renames it.
  phone:
    left:
      - { card: 1, size: short } # Onchain Banking Account
      - { card: 9, size: short } # Rewards Hub
      - { card: 3, size: tall } # Shopping Rewards
      - { card: 4, size: tall } # Deone Vault
    right:
      - { card: 5, size: tall } # Cloud Miner
      - { card: 2, size: short, label: Metal Tokenized Card } # the Executive Card picture
      - { card: 10, size: short } # Wellness
      - { card: 12, size: tall } # Price and Purchase Protection

details:
  headline: Full benefits
  subtext: Explore the banking, travel, wellbeing, rewards and protection included in Executive.

  # Shown three to a row. `icon` is one of: card, coin, connect, travel, wellness, diamond.
  groups:
    - title: Products
      icon: card
      items:
        - Metal tokenized card
        - Cold storage Vault
    - title: Banking
      icon: coin
      items:
        - Onchain banking account
        - Zero FX Fees
        - Price and purchase protection
        - Local currency reserves
    - title: Connectivity
      icon: connect
      items:
        - Cloud miner
        - eSIM 10 GB
    - title: Travel
      icon: travel
      items:
        - +1,700 airport lounges worldwide
        - Travel accident insurance
        - Baggage delay
        - Lost luggage
    - title: Wellness
      icon: wellness
      items:
        - Wellness benefits access
        - Wellness point system
    - title: Rewards
      icon: diamond
      items:
        - Rewards hub
        - Shopping rewards

# No closing banner on this page. To lead on to another suite, add a `next:` block like
# the one at the end of prestige.yaml.
