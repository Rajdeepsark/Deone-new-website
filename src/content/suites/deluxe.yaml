# PLACEHOLDER CONTENT: parts of this page still reuse the Prestige copy and pictures. The
# name, the hero, the colours below, the carousel, "A broader way to live", the quote,
# "Your Deone Card", "What's included", "Full benefits" and the closing banner are
# Deluxe's own; pictures still standing in are marked STAND-IN. Replace the rest with the
# Deluxe copy and pictures as they arrive.
name: Deluxe

# The page's colours, section by section. `background` takes any CSS background; `ink` is
# the colour of the section's words and lines. Quote any value with a # in it, or YAML
# reads the rest of the line as a comment.
theme:
  # "A place to belong": from the design file.
  pictures:
    background: "linear-gradient(180deg, #F2FBF9 0%, #CCEEE7 95.51%)"
    sliderAccent: "#80D5C2"
  # PROVISIONAL: the design's backgrounds for the next two sections have not arrived.
  # Until they do, these are built from the greens around them, each starting where the
  # section above ends. Replace each with the value from the design file.
  benefits:
    background: "linear-gradient(180deg, #CCEEE7 0%, #F2FBF9 100%)"
  security:
    # PROVISIONAL: read off the design screenshot, which runs from the darker green down
    # to the lighter, so it ends where "Your Deluxe membership" starts.
    background: "linear-gradient(180deg, #CCEEE7 0%, #F2FBF9 100%)"
    # The rest of this section is from the design file. The feature boxes; the one in
    # focus has no line around it.
    box: "#FCFAF7"
    boxLine: transparent
    # The feature icons: a mint tile with a graphite drawing.
    icon: "linear-gradient(0deg, #F2FBF9 -71.25%, #80D5C2 100%)"
    iconInk: "#454947"
  # "Your Deluxe membership": from the design file.
  included:
    background: "linear-gradient(180deg, #F2FBF9 0%, #80D5C2 100%), linear-gradient(180deg, #FCFAF7 0%, #454947 81.08%)"
  # "Full benefits": from the design file.
  details:
    background: "#80D5C2"
    ink: "#454947"
  # Still on the Prestige defaults: accent and night.

hero:
  eyebrow: Suite
  # PLACEHOLDER TEXT: the Prestige sentence, until this suite's own arrives. It fades in
  # over the picture as the page scrolls through the hero.
  body: |-
    For lives shaped by movement, ambition
    and possibility.
  # STAND-IN PICTURE: the homepage's Deluxe picture. It is 1536px wide, so it is soft on
  # large screens. Replace with the hero picture from the design file.
  image: /suites/deluxe-hero.jpg
  imageAlt: Man serving a tennis ball on a hillside court overlooking the sea at sunset
  # The player stands left of centre, so that is where phones look.
  imagePosition: 29% center
  # From the design file: a 50% black scrim over a green tint that fades out down the
  # picture. (The design's faint dark vignette in the middle is left out.)
  overlay: "linear-gradient(0deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), linear-gradient(180deg, rgba(128, 213, 194, 0.6) 0%, rgba(128, 213, 194, 0) 63.92%)"

pictures:
  # The line breaks are the design's.
  headline: |-
    A place
    to belong
  subtext: More to discover in the life you lead

  # Four pictures floating around the headline, in this order:
  # small top-left (blurred), top-right, large bottom-left, small right (blurred)
  gallery:
    - image: /suites/prestige-dune-detail.jpg
    - image: /suites/prestige-dune.jpg
      alt: A lone figure walking the ridge of a desert dune
    - image: /suites/prestige-coast.jpg
      alt: Yachts anchored in a sheltered cove beneath pale cliffs
    - image: /suites/prestige-cliffs.jpg

  # The Deluxe pictures and wording. Each picture is paired with the title it suits.
  slides:
    - title: In good company
      description: A members-only community of people in the know.
      image: /suites/deluxe-beach-table.jpg
      imageAlt: Friends laughing over a seafood lunch at a low table under parasols, boats at anchor on the sea behind

    - title: Beyond the familiar
      description: Curated experiences that bring a different perspective.
      image: /suites/deluxe-coast-drive.jpg
      imageAlt: Couple laughing in the front seats of a car on a coast road at sunset, a child grinning in the back

    - title: Wellness, woven in
      description: A more personal rhythm for feeling well.
      image: /suites/deluxe-hot-tub.jpg
      imageAlt: Man resting in an outdoor hot tub beside a glass wall, looking out at trees under a clear sky

benefits:
  eyebrow: Deone Membership
  headline: A broader way to live
  # In the design the last picture's rounded corner mirrors the first one's.
  lastCorner: left

  # The Deluxe wording and pictures, from the design. "Learn more" shows only under an
  # item with an `href`, the page it goes to. No item has one yet, so the link is hidden.
  # Phones never show it, as in the phone design.
  # A line break in a description is kept on phones and wide screens. These have none:
  # at the design's width they wrap by themselves where the design does.
  items:
    - title: Banking
      description: Global spending through your Onchain Banking Account.
      image: /suites/deluxe-banking.jpg
      imageAlt: City skyline across the water at sunset

    - title: Wellness
      description: Tools that support how you feel and live.
      image: /suites/deluxe-wellness.jpg
      imageAlt: Three women in robes relaxing on a sofa in a glass-walled garden room, trees in sunlight beyond

    - title: Rewards
      description: Rewards that grow as you spend, travel and live.
      image: /suites/deluxe-rewards.jpg
      imageAlt: Woman in sunglasses and a white shirt carrying shopping bags through a palm-lined resort

quote:
  # The line breaks are the design's; wide screens keep them, phones wrap freely.
  text: |-
    A membership that makes room for
    what matters.
  # The export already has the design's darkening in it.
  image: /suites/deluxe-quote.jpg
  imageAlt: Couple talking on a daybed beside an infinity pool above the sea, a child splashing in the water
  # The couple lie left of centre, so that is where phones look.
  imagePosition: 21% top

security:
  eyebrow: Products
  headline: Your Deone Card
  subtext: One card, bringing physical and digital together.

  # The Deluxe wording, from the design. Deluxe has one product, so the list below has
  # one entry and the section shows no tabs: just the card and its features. A second
  # entry would bring the tabs back.
  # On wide screens the section scrolls through the features one by one.
  # `icon` is any name from src/icons.ts, e.g. globe, card, lock, shield, plane, percent.
  tabs:
    - label: Deone Card
      # The card turning once around as the page scrolls. These are the Executive page's
      # frames: the design shows the Executive card here. Point `folder` at Deluxe's own
      # frames (see scripts/import-sequence.mjs) if a Deluxe render arrives.
      sequence: { folder: /suites/executive-card-turntable, frames: 150 }
      imageAlt: Black metal Deone card, tilted, floating above its shadow
      # Where the picture sits in the 1512px design frame, in px, measured from the card's
      # edges in the design. `top` counts as on the pages with tabs, where the list's
      # window starts at 626.
      imagePlacement: { left: 747, top: 670, width: 780 }
      features:
        - icon: globe
          title: Worldwide spending
          description: Pay around the world with your Deone Card.
        - icon: card
          title: Physical and digital
          description: Both forms, brought together as one card.
        - icon: lock
          title: Payment security
          description: Security built into every payment.

included:
  eyebrow: What's included
  headline: Your Deluxe membership
  subtext: Banking, wellness and rewards, with the Deone Card.

  # The Deluxe cards and wording, from the design. Five cards, listed column by column:
  # two on the left, one in the middle, two on the right.
  # `size` is `square` (328 x 328), `tall` (328 x 431) or `full`: a column to itself, as
  # tall as the columns beside it (328 x 680 here).
  items:
    # Left column
    - label: |-
        Onchain Banking
        Account
      size: square
      image: /suites/prestige-included-onchain-banking.jpg
      imageAlt: Man in a suit walking between dark glass towers
    - label: Deone Card
      size: square
      image: /suites/prestige-included-prestige-card.jpg
      imageAlt: Hands holding a brushed metal card

    # Middle column
    # The design's picture, in the 328 x 431 cut made for Prestige, so this taller card
    # trims its sides. Replace with the 328 x 680 cut (2x) when it arrives.
    - label: Better Life Rewards™
      size: full
      image: /suites/prestige-included-cloud-miner.jpg
      imageAlt: Man in a cream sweater and a wristwatch at a laptop on a round table

    # Right column
    # Both pictures are the design's own square cuts (328 x 328, 1.5x).
    - label: Rewards Hub
      size: square
      image: /suites/deluxe-included-rewards-hub.jpg
      imageAlt: Woman in sunglasses and a white shirt carrying shopping bags through a palm-lined resort
    - label: Wellness Club
      size: square
      image: /suites/deluxe-included-wellness-club.jpg
      imageAlt: Yoga class sitting cross-legged on mats in a sunlit studio, tall windows looking onto the city

  # PROVISIONAL: there is no phone design for these five cards yet, so this echoes the
  # wide one. Phones show two columns, top to bottom.
  # `card` is the card's place in the list above (1 to 5). `size` is its height there:
  # `short` (177 x 224) or `tall` (177 x 264) in the 402px design, or `full`, the height
  # its column has left over beside the taller one. `label` renames it.
  phone:
    left:
      - { card: 1, size: short } # Onchain Banking Account
      - { card: 2, size: short } # Deone Card
      - { card: 4, size: short } # Rewards Hub
    right:
      - { card: 3, size: full } # Better Life Rewards™
      - { card: 5, size: short } # Wellness Club

details:
  headline: Full benefits
  subtext: The parts of Deone, gathered in one membership.

  # The Deluxe groups, items and icons, as the design shows them. Shown three to a row.
  # `icon` is any name from src/icons.ts, e.g. card, coin, connect, travel, wellness, diamond.
  groups:
    - title: Products
      icon: card
      items:
        - Deone Card
    - title: Banking
      icon: coin
      items:
        - Onchain Banking Account
        - Global spending
    - title: Membership
      icon: connect
      items:
        - Members-only community
    - title: Experiences
      icon: travel
      items:
        - Curated experiences
    - title: Wellness
      icon: wellness
      items:
        - Wellness Club
        - Wellness tools
    - title: Rewards
      icon: diamond
      items:
        - Better Life Rewards
        - Rewards Hub

# The banner that closes the page and leads on to another suite.
# `href` is where it goes. `color` is the wall colour phones fade the picture into at
# the top, so it should match the top of the picture.
next:
  eyebrow: Suite
  name: Prestige
  href: /suites/prestige
  color: "#524033"
  image: /suites/prestige-hero.jpg
  imageAlt: Executive on a phone call at his desk in a high-rise office overlooking the Manhattan skyline at dusk
